[workspace]
members = [
    "crates/aurora-core",
    "crates/aurora-cli",
    "crates/aurora-openai",
    "crates/aurora-research",
    "crates/aurora-tavily",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.0.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
