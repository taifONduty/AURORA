[package]
name = "aurora-research-openai"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
aurora-core = { path = "../aurora-core" }
aurora-openai = { path = "../aurora-openai" }
aurora-research = { path = "../aurora-research" }
aurora-tavily = { path = "../aurora-tavily" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "test-util", "time"] }
tokio-util = "0.7"

[dev-dependencies]
ring = "0.17"
